<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Québec Urbain Map</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><link rel="stylesheet" href="style.css"></head><body><div id="map"></div><aside class="panel"><h1>🗺️ Québec Urbain Map</h1><p>Carte interactive du Québec</p><label><input type="checkbox" data-layer="rail">🚂 Réseau ferroviaire</label><label><input type="checkbox" data-layer="exo">🚆 Trains de banlieue</label><label><input type="checkbox" data-layer="stations">🚉 Gares</label><label><input type="checkbox" data-layer="walls">🎨 Murs légaux</label><label><input type="checkbox" data-layer="skate">🛹 Skateparks</label><label><input type="checkbox" data-layer="events">🎪 Événements</label><label><input type="checkbox" data-layer="shops">🏪 Boutiques graffiti</label><label><input type="checkbox" data-layer="favorites">⭐ Favoris</label><button id="showAll">Afficher toutes les couches</button><small>Pas de métro • pas de murales • pas de pistes cyclables</small></aside><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="app.js"></script></body></html>
